services:
  app:
    image: ${MARKET_RADAR_IMAGE:?Set MARKET_RADAR_IMAGE to a versioned local image tag}
    init: true
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - /srv/hackaton/shared/app.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=1024
      MARKET_RADAR_DATA_DIR: /app/data
      MARKET_RADAR_SESSION_DB: /app/runtime/conversations.sqlite
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${MARKET_RADAR_DATA_PATH:-/srv/hackaton/shared/data/0.6.0-local}
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MARKET_RADAR_RUNTIME_PATH:-/srv/hackaton/shared/runtime}
        target: /app/runtime
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(4000)}).then(async r=>{const h=await r.json();process.exit(r.ok&&h.status==='ok'?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
